; Pool dedicado. 10 CPU / 10 GB RAM / MySQL remoto / Redis local.
; Cada worker de Filament+Livewire ronda 50-80 MB. Reservamos:
;   OS+Nginx ~0.6 GB | Redis ~1 GB | workers cola ~0.6 GB | margen ~1 GB
;   PHP-FPM ~6.5 GB  => max_children 80

[tdg]
user = deploy
group = deploy
listen = /run/php/php8.4-fpm-tdg.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 80
pm.start_servers = 16
pm.min_spare_servers = 8
pm.max_spare_servers = 24
pm.max_requests = 400
pm.process_idle_timeout = 10s

request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.4-fpm-tdg-slow.log

chdir = /
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /var/log/php8.4-fpm-tdg-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[max_input_time] = 60
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 32M
php_admin_flag[expose_php] = off
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl] = 600
