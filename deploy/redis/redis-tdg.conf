# Fragmento aplicado por provision.sh sobre /etc/redis/redis.conf
# Redis es la capa caliente: cache, sesiones y colas. El disco es HDD.

bind 127.0.0.1
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300

# Persistencia para no perder jobs de la cola ante un reboot.
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshots RDB menos agresivos (el HDD odia fsync frecuentes).
save 300 100
save 60 10000

maxmemory 1gb
maxmemory-policy volatile-lru

# Las keys de cola (sin TTL) no las evicta volatile-lru.
# Si se llena la RAM, Redis conserva jobs y tira cache/sesiones.

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
activerehashing yes
hz 10
dynamic-hz yes
