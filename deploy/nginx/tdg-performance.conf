# /etc/nginx/conf.d/tdg-performance.conf
# No repetir server_tokens, keepalive_timeout ni gzip on:
# Debian 13 ya los define en /etc/nginx/nginx.conf.

keepalive_requests 1000;
reset_timedout_connection on;
client_body_timeout 12s;
client_header_timeout 12s;
send_timeout 12s;
client_max_body_size 32m;
client_body_buffer_size 128k;
large_client_header_buffers 4 16k;

open_file_cache max=10000 inactive=30s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/vnd.ms-fontobject
    font/ttf
    font/otf
    font/woff
    font/woff2
    image/svg+xml;
