# /etc/nginx/conf.d/tdg-brotli.conf
# Solo se instala si existe libnginx-mod-http-brotli.

brotli on;
brotli_static on;
brotli_comp_level 5;
brotli_min_length 256;
brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/vnd.ms-fontobject
    font/ttf
    font/otf
    font/woff
    font/woff2
    image/svg+xml;
